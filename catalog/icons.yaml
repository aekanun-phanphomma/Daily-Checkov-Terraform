# Terraform resource type -> official cloud architecture icon.
#
# Code picks the icon from the resource type; the model never does. A cloud
# with no package here (GCP for now) or a run without the packages falls
# back to the neutral line icons in templates/story.html -- an icon is never
# a reason to skip a post.
#
# The packs are NOT committed: the vendors license them for diagrams and
# documentation, not for redistribution in someone else's public repo.
# `python src/icons.py fetch` downloads each pack from the URL in
# AWS_ICONS_URL / AZURE_ICONS_URL (repo variables), refuses it unless the
# sha256 below matches, and extracts only the files mapped here into
# icons/vendor/ (gitignored). Locally: `python src/icons.py extract <zip>...`.
#
# Icons are drawn as shipped -- no recolour, crop or rotation (Microsoft's
# terms say so explicitly). Every state effect (EXPOSED, PROTECTED, the fix
# ring) goes on the frame around the icon, never on the icon.
#
#   icon: what the attack is after (the target)
#   gate: set when the resource IS the control (security group, NSG rule,
#         firewall rule); `icon` is then what that control protects, so the
#         picture reads  Internet -> [NSG] -> VM.

packages:
  aws:
    file: Icon-package_07312026.5846e92413caa21490223536cc97f1269e44fa92.zip
    sha256: d2d166c453526471749d520e0db022c459abef759d2946cf2dd1d1c992dc6526
    root: ""
    extras:
      subnet: Architecture-Group-Icons_07312026/Private-subnet_32.svg
  azure:
    file: Azure_Public_Service_Icons_V24.zip
    sha256: 921594ccd1bf3d9c0a1bd7b6d924e050551a59342f2b353bb74bdcf761c35141
    root: Azure_Public_Service_Icons/
    extras:
      subnet: Icons/networking/02742-icon-service-Subnet.svg

