# Curated priority list. This file, not Checkov, decides what is "important":
# open-source Checkov has no severity field (severity comes from the Prisma
# Cloud API and needs --bc-api-key), so the priority below is ours and must
# never be described in a post as "Checkov severity".
#
#   P1  direct exposure: internet ingress, public data, wildcard IAM, secrets
#   P2  defence in depth: encryption, TLS, IMDSv2, hardening, supply chain
#   P3  detection: logging and audit trails
#
# Every id + resource pair was taken from `checkov --list --framework terraform`
# on the version pinned in requirements.txt, and tests/test_catalog.py re-checks
# that on every run. `enabled: false` parks a rule the generator keeps failing
# on (the failure issue tells you which one) without losing its history.
#
# `resource` is the type the example must use. Several checks apply to more
# than one type; we pick the one that makes the clearest teaching example.
# Resources azurerm v4 deprecates (azurerm_sql_server, single-server
# PostgreSQL/MySQL) are left out on purpose.
#
# Order matters: within one cloud and priority the selector takes entries top
# to bottom, so topics are interleaved here to keep consecutive posts on that
# cloud from being "SSH, then RDP, then port 80". The cloud rotation spaces
# same-cloud posts three days apart on top of that.
#
# ~45 rules per cloud keeps the AWS -> Azure -> GCP rotation even until the
# end, instead of one cloud running out early and the others doubling up.

