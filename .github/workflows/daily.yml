name: checkov-daily

on:
  schedule:
    # 00:30 UTC == 07:30 Asia/Bangkok (UTC+7, no DST). GitHub's scheduler is
    # best-effort and often 5-30 minutes late; nothing here is minute-critical.
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate and verify, print the post, publish nothing"
        type: boolean
        default: false
      rule:
        description: "Force one check id, e.g. CKV_AWS_53 (testing)"
        type: string
        default: ""
      allow_extra_post:
        description: "Publish even if today already has a post (stored as <date>-2)"
        type: boolean
        default: false

# Both jobs push to the default branch; two runs must never interleave.
concurrency:
  group: checkov-daily
  cancel-in-progress: false

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

jobs:
  # Holds the LLM key and runs model-written Terraform through init/validate.
  # It has no social tokens and cannot push, so the worst a bad model output
  # can do here is fail the job.
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write          # failure report
    outputs:
      generated: ${{ steps.gen.outputs.generated }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.6"
          # The wrapper rewrites stdout/exit codes for step outputs; gates.py
          # parses terraform's output itself and needs it untouched.
          terraform_wrapper: false

      - name: Install tools
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # Official AWS/Azure icons. Optional: without the variables, or if a
      # pack's sha256 no longer matches catalog/icons.yaml, the card uses
      # its neutral icons and the run only gets a warning annotation.
      - name: Fetch cloud icon packs
        env:
          AWS_ICONS_URL: ${{ vars.AWS_ICONS_URL }}
          AZURE_ICONS_URL: ${{ vars.AZURE_ICONS_URL }}
        run: python src/icons.py fetch

      - name: Generate and verify (gates G1-G8)
        id: gen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          ALLOW_EXTRA_POST: ${{ inputs.allow_extra_post && '1' || '' }}
          # Passed through env, never interpolated into the script, so a
          # crafted input cannot inject shell.
          RULE: ${{ inputs.rule }}
        run: python src/generate.py --dir out/today ${RULE:+--rule "$RULE"}

      - uses: actions/upload-artifact@v4
        if: steps.gen.outputs.generated == 'true'
        with:
          name: post-bundle
          path: out/today
          retention-days: 7

      - name: Open an issue when nothing could be published
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day=$(TZ=Asia/Bangkok date +%F)
          {
            echo "No post was published for $day."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            if [ -f out/today/failures.json ]; then
              echo "Rules tried (each with up to 2 repairs):"
              jq -r '.failures[] | "- `\(.check_id)`: \(.reason | split("\n")[0])"' out/today/failures.json
              echo
              echo "A rule that fails again and again can be parked with"
              echo "\`enabled: false\` in catalog/rules.yaml."
            fi
          } > issue.md
          gh issue create --title "checkov-daily: no post for $day" --body-file issue.md

  # Holds the social tokens and write access, and never runs model output.
  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GENERATED: ${{ needs.generate.outputs.generated }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      ALLOW_EXTRA_POST: ${{ inputs.allow_extra_post && '1' || '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        if: env.GENERATED == 'true'
        with:
          name: post-bundle
          path: out/today

      - name: Set bot identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Commit the proof BEFORE posting, so the link in the post resolves the
      # moment it goes live.
      - name: Stage and push the verified bundle
        if: env.GENERATED == 'true' && env.DRY_RUN != '1'
        run: |
          python src/publish.py stage --from out/today
          rm -rf out/today
          git add out state
          git commit -m "post: $(jq -r '.posts[-1].check_id' state/posted.json) [skip ci]"
          git pull --rebase --quiet
          git push

      - name: Post to LinkedIn and Facebook
        if: env.GENERATED == 'true' || env.DRY_RUN != '1'
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
        run: |
          if [ "$DRY_RUN" = "1" ]; then
            python src/publish.py post --dry-run --dir out/today
          else
            python src/publish.py post
          fi

      # Not success(): publish.py records each platform's post id the moment
      # it is confirmed. If Facebook failed after LinkedIn succeeded, that
      # LinkedIn id must still be committed, or a re-run would post it twice.
      - name: Commit post ids
        if: ${{ !cancelled() && env.DRY_RUN != '1' }}
        run: |
          if git diff --quiet -- state/posted.json; then
            echo "state unchanged"; exit 0
          fi
          git add state/posted.json
          git commit -m "state: record post ids [skip ci]"
          git pull --rebase --quiet
          git push
