name: ci

# Tests on every change to code, prompts, schemas, catalog or template. Bot
# commits carry [skip ci] and only touch out/ and state/, so they never run
# this.
on:
  push:
    paths-ignore: ["out/**", "state/**", "**.md"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.6"
          terraform_wrapper: false
      - name: Install tools
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Tests, including the end-to-end run on the S3 fixture
        env:
          RUN_SLOW: "1"
        run: python -m pytest -q
